repos:
    - repo: local
      hooks:
          - id: ruff-format
            name: ruff format
            entry: ruff format
            language: python
            additional_dependencies:
                - ruff==0.16.5
            types:
                - python

          # Lint, not format. ruff format normalizes layout but never reports a
          # lint finding, so without this hook the rule set declared in ruff.toml
          # would be unenforced. --fix applies the safe fixes; --force-exclude
          # makes ruff honour ruff.toml's exclude list for the explicit filenames
          # pre-commit passes on the command line. The version here is pinned to
          # the one in ruff.toml and requirements-test.txt; a mismatch fails
          # loudly rather than linting with a different rule set.
          - id: ruff-check
            name: ruff check
            entry: ruff check --fix --force-exclude
            language: python
            additional_dependencies:
                - ruff==0.16.5
            types:
                - python

          # One formatter for the frontend code and every YAML file the repository
          # owns: Ansible, Compose, CloudFormation and CI. Style comes from
          # .prettierrc, not from this hook. api/templates/*.html stays out because
          # those are Jinja2 templates, not plain HTML.
          - id: prettier
            name: prettier
            entry: prettier --write
            language: node
            additional_dependencies:
                - prettier@3.9.6
            files: ^((src/web|tests)/.*\.(js|mjs|html)|.*\.(yml|yaml))$

    # Shell style comes from this hook's args, not from .prettierrc: -i 4 matches
    # its tabWidth, and -ci indents case bodies. The python language vendors a
    # prebuilt shfmt binary, so no Go toolchain is needed.
    - repo: https://github.com/scop/pre-commit-shfmt
      rev: 479be5958357ba5ab65ce47172117348516860e9 # v3.14.1-1
      hooks:
          - id: shfmt
            args: [--write, -i, '4', -ci]
