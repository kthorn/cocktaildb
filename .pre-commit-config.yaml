repos:
    - repo: local
      hooks:
          - id: ruff-format
            name: ruff format
            entry: ruff format
            language: python
            additional_dependencies:
                - ruff==0.16.5
            types:
                - python

          # One formatter for the frontend code and every YAML file the repository
          # owns: Ansible, Compose, CloudFormation and CI. Style comes from
          # .prettierrc, not from this hook. api/templates/*.html stays out because
          # those are Jinja2 templates, not plain HTML.
          #
          # Shell is not covered yet: prettier needs prettier-plugin-sh for it, and
          # prettier resolves --plugin relative to the repository, not to this
          # hook's node environment, so a bare plugin specifier cannot be found.
          # Add it once a root package.json and node_modules exist.
          - id: prettier
            name: prettier
            entry: prettier --write
            language: node
            additional_dependencies:
                - prettier@3.9.6
            files: ^((src/web|tests)/.*\.(js|mjs|html)|.*\.(yml|yaml))$
