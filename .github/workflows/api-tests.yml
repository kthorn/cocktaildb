name: API compatibility

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    api-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # PostgreSQL as a service container: the suite needs a real database
        # (plpgsql triggers, pg_trgm, advisory locks), and this way the tests do
        # not pay for container startup or depend on the Docker socket.
        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_USER: test_user
                    POSTGRES_PASSWORD: test_password
                    POSTGRES_DB: cocktaildb_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            TEST_DB_HOST: localhost
            TEST_DB_PORT: '5432'
            TEST_DB_NAME: cocktaildb_test
            TEST_DB_USER: test_user
            TEST_DB_PASSWORD: test_password
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: 3.12.10
                  cache: pip
                  cache-dependency-path: |
                      api/requirements.txt
                      requirements-test.txt

            - name: Set up Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22.22.2
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install frontend dependencies
              run: npm ci

            - name: Build the frontend artifact
              run: npm run build

            - name: Install production and test dependencies
              run: |
                  python -m pip install -r requirements-test.txt
                  python -m pip check

            - name: Check database result types
              run: python -m pyright --pythonpath "$(command -v python)" api/db/db_core.py

            - name: Check Docker for PostgreSQL fixtures
              run: docker info

            - name: Run the test suite
              run: python -m pytest -q
