<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logging out...</title>
        <script type="module">
            import { clearSession } from './js/auth.js';
            document.addEventListener('DOMContentLoaded', () => {
                // Clear all auth-related data from localStorage
                clearSession();

                document.getElementById('status').textContent = 'Logout successful. Redirecting...';

                // Redirect back to the main page
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            });
        </script>
        <link rel="stylesheet" href="/normalize.css" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
        <link rel="shortcut icon" href="/img/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Mixology Tools" />
        <link rel="manifest" href="/site.webmanifest" />
    </head>
    <body>
        <div id="container" class="login-callback">
            <h1>Logging Out</h1>
            <p id="status">Processing logout...</p>
        </div>
        <script type="module" src="js/common.js"></script>
    </body>
</html>
