<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logging in...</title>
        <script type="module">
            import { completeLogin } from './js/auth.js';

            document.addEventListener('DOMContentLoaded', async () => {
                try {
                    await completeLogin();
                    document.getElementById('status').textContent =
                        'Login successful. Redirecting...';
                    window.location.replace('index.html');
                } catch {
                    document.getElementById('status').textContent =
                        'Login failed. Please return home and try again.';
                    const link = document.createElement('a');
                    link.href = 'index.html';
                    link.textContent = 'Back to Home';
                    document.getElementById('status').after(link);
                }
            });
        </script>
    </head>
    <body>
        <div id="container" class="login-callback">
            <h1>Authentication</h1>
            <p id="status">Processing login...</p>
        </div>
        <script type="module" src="js/common.js"></script>
    </body>
</html>
