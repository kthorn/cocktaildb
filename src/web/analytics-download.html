<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Analytics Downloads - Mixology Tools</title>
        <link rel="stylesheet" href="/normalize.css" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
        <link rel="shortcut icon" href="/img/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Mixology Tools" />

    <body>
        <!-- Header will be loaded by common.js -->

        <main>
            <section class="about-content">
                <h2>Analytics Downloads</h2>
                <p>
                    Download the latest EM pairwise recipe distance matrix. This file contains the
                    full recipe-by-recipe distance values used before embedding.
                </p>
                <p>
                    <a
                        class="btn btn-primary"
                        href="/api/v1/analytics/recipe-distances-em/download"
                    >
                        Download EM distance matrix
                    </a>
                </p>
            </section>
        </main>

        <!-- Footer will be loaded by common.js -->
        <script type="module" src="js/common.js"></script>
    </body>
