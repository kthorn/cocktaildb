<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <title>Ingredients - Mixology Tools</title>
        <link rel="stylesheet" href="/normalize.css" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="/ingredient-tree.css" />
        <link rel="icon" type="image/png" href="/img/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
        <link rel="shortcut icon" href="/img/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Mixology Tools" />
        <link rel="manifest" href="/site.webmanifest" />
    </head>

    <body>
        <!-- Header will be loaded by common.js -->

        <main>
            <section class="ingredients-section">
                <h2 id="ingredients-title">Ingredients</h2>

                <div class="ingredient-form">
                    <h3>Add New Ingredient</h3>
                    <form id="ingredient-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ingredient-name">Name:</label>
                                <input type="text" id="ingredient-name" required />
                            </div>

                            <div class="form-group">
                                <label for="ingredient-parent">Parent:</label>
                                <div class="ingredient-search-container">
                                    <input
                                        type="text"
                                        id="ingredient-parent-search"
                                        placeholder="Search parent ingredient..."
                                        autocomplete="off"
                                    />
                                    <div class="loading-indicator" id="parent-loading-indicator">
                                        <div class="loading-spinner"></div>
                                    </div>
                                    <div class="search-status" id="parent-search-status">
                                        Loading ingredients...
                                    </div>
                                    <div
                                        class="autocomplete-dropdown"
                                        id="parent-autocomplete-dropdown"
                                    ></div>
                                    <select id="ingredient-parent" class="hidden">
                                        <option value>None</option>
                                        <!-- Parent options will be populated via JS -->
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ingredient-description">Description:</label>
                            <textarea id="ingredient-description" rows="3"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="ingredient-url">URL:</label>
                            <input
                                type="url"
                                id="ingredient-url"
                                placeholder="https://example.com"
                            />
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="ingredient-percent-abv">ABV %:</label>
                                <input
                                    type="number"
                                    id="ingredient-percent-abv"
                                    min="0"
                                    max="100"
                                    step="0.1"
                                />
                            </div>
                            <div class="form-group">
                                <label for="ingredient-sugar-g-per-l">Sugar (g/L):</label>
                                <input
                                    type="number"
                                    id="ingredient-sugar-g-per-l"
                                    min="0"
                                    max="1000"
                                    step="0.1"
                                />
                            </div>
                            <div class="form-group">
                                <label for="ingredient-acid-g-per-l">Acid (g/L):</label>
                                <input
                                    type="number"
                                    id="ingredient-acid-g-per-l"
                                    min="0"
                                    max="100"
                                    step="0.1"
                                />
                            </div>
                        </div>

                        <div class="form-group checkbox-group">
                            <input
                                type="checkbox"
                                id="ingredient-allow-substitution"
                                name="allow_substitution"
                            />
                            <label for="ingredient-allow-substitution">
                                Allow substitution with siblings/ancestors
                                <span
                                    class="tooltip"
                                    title="When enabled, this ingredient can be substituted with similar ingredients that share the same parent in recipes"
                                    >ⓘ</span
                                >
                            </label>
                        </div>

                        <button type="submit">Add Ingredient</button>
                    </form>
                </div>

                <div class="ingredients-list">
                    <h3>Existing Ingredients</h3>
                    <div class="search-bar">
                        <input
                            type="text"
                            id="ingredient-search"
                            placeholder="Search ingredients..."
                        />
                    </div>
                    <div id="ingredients-container">
                        <!-- Ingredients will be loaded here -->
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="js/common.js"></script>
        <script type="module" src="js/api.js"></script>
        <script type="module" src="js/ingredients.js"></script>
    </body>
</html>
