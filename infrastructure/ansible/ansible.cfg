# infrastructure/ansible/ansible.cfg
[defaults]
# Always pass -i inventory/<environment>.yml; deploy-ec2.sh does. With no
# inventory, `hosts: cocktaildb` matches nothing and the play is a no-op.
remote_user = ec2-user
private_key_file = ~/.ssh/cocktaildb-ec2.pem
host_key_checking = False
roles_path = roles

[privilege_escalation]
become = True
become_method = sudo
