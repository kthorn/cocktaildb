# infrastructure/ansible/playbooks/deploy-caddy.yml
---
- name: Deploy Caddy configuration
  hosts: cocktaildb
  become: yes

  vars:
      caddy_config_dir: /etc/caddy
      web_root: /opt/cocktaildb/web

  tasks:
      - name: Create Caddy log directory
        file:
            path: /var/log/caddy
            state: directory
            owner: caddy
            group: caddy
            mode: '0755'

      - name: Create web root directory
        file:
            path: '{{ web_root }}'
            state: directory
            owner: cocktaildb
            group: cocktaildb
            mode: '0755'

      - name: Create Caddy systemd override directory
        file:
            path: /etc/systemd/system/caddy.service.d
            state: directory
            owner: root
            group: root
            mode: '0755'

      # The domain comes from the inventory. deploy.yml publishes the same file,
      # so there is exactly one Caddy configuration to keep current.
      - name: Deploy Caddyfile
        copy:
            src: '{{ playbook_dir }}/../../caddy/Caddyfile'
            dest: '{{ caddy_config_dir }}/Caddyfile'
            owner: root
            group: root
            mode: '0644'
        notify: Restart Caddy

      - name: Configure Caddy environment variables
        copy:
            dest: /etc/systemd/system/caddy.service.d/override.conf
            content: |
                [Service]
                Environment=DOMAIN_NAME={{ domain_name }}
                Environment=ACME_EMAIL=admin@{{ domain_name }}
            owner: root
            group: root
            mode: '0644'
        notify:
            - Daemon reload
            - Restart Caddy

      - name: Ensure Caddy is running
        systemd:
            name: caddy
            state: started
            enabled: yes

  handlers:
      - name: Daemon reload
        systemd:
            daemon_reload: yes

      # Caddy has its admin API disabled (admin off), so a reload is unavailable.
      - name: Restart Caddy
        systemd:
            name: caddy
            state: restarted
