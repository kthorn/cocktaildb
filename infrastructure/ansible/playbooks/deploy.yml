# infrastructure/ansible/playbooks/deploy.yml
---
- name: Deploy CocktailDB Application
  hosts: cocktaildb
  become: yes

  vars:
    app_home: /opt/cocktaildb
    app_user: cocktaildb
    app_group: cocktaildb
    release_root: "{{ app_home }}/releases/{{ deployment_release_id }}"
    release_web_root: "{{ release_root }}/web"

  pre_tasks:
    - name: Freeze deployment release ID
      ansible.builtin.set_fact:
        deployment_release_id: "{{ deployment_release_id | default(lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ'), true) }}"

    # This atomic directory lock is acquired before the first remote mutation.
    # A failed play intentionally leaves it for operator inspection.
    - name: Acquire deployment lifecycle lock
      ansible.builtin.command:
        argv:
          - mkdir
          - /var/lock/cocktaildb-deploy-ansible.lock
      changed_when: true

  tasks:
    # Validate required environment variables
    - name: Check COCKTAILDB_DB_PASSWORD is set
      fail:
        msg: |
          COCKTAILDB_DB_PASSWORD environment variable must be set.
          Run: export COCKTAILDB_DB_PASSWORD='your-password'
      when: db_password is not defined or db_password == ""

    - name: Warn if using default password in production
      fail:
        msg: |
          Cannot use default password 'changeme' in production.
          Set COCKTAILDB_DB_PASSWORD to the actual database password.
      when: app_env == 'prod' and db_password == 'changeme'

    # Stage the whole release away from the currently served frontend. The
    # cutover helper is the only task allowed to publish release_web_root.
    - name: Create staged release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_home }}/releases"
        - "{{ release_root }}"
        - "{{ release_root }}/api"
        - "{{ release_web_root }}"
        - "{{ release_root }}/packages"
        - "{{ release_root }}/migrations"

    - name: Stage API code
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../../../api/"
        dest: "{{ release_root }}/api/"
        delete: yes
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.pytest_cache"
          - "--exclude=tests/"
          - "--exclude=*.db"

    - name: Stage frontend code
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../../../src/web/"
        dest: "{{ release_web_root }}/"
        delete: yes
        rsync_opts:
          - "--exclude=config.js"

    - name: Stage barcart package
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../../../packages/barcart/"
        dest: "{{ release_root }}/packages/barcart/"
        delete: yes
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=*.pyc"
          - "--exclude=.pytest_cache"
          - "--exclude=tests/"

    - name: Stage frontend config.js
      ansible.builtin.template:
        src: ../files/config.js.j2
        dest: "{{ release_web_root }}/js/config.js"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'

    - name: Stage docker-compose files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ release_root }}/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
      loop:
        - "{{ playbook_dir }}/../../../docker-compose.yml"
        - "{{ playbook_dir }}/../../../docker-compose.prod.yml"

    - name: Stage docker ignore
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../../.dockerignore"
        dest: "{{ release_root }}/.dockerignore"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'

    # Keep operational scripts and Compose configuration at stable paths used
    # by systemd and by the cutover helper. Updating these does not start code.
    - name: Copy active docker-compose files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_home }}/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
      loop:
        - "{{ playbook_dir }}/../../../docker-compose.yml"
        - "{{ playbook_dir }}/../../../docker-compose.prod.yml"

    - name: Copy deployment scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../scripts/"
        dest: "{{ app_home }}/scripts/"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
        directory_mode: '0755'

    # Copy systemd units
    - name: Copy systemd service units
      copy:
        src: "{{ playbook_dir }}/../../systemd/"
        dest: /etc/systemd/system/
        owner: root
        group: root
        mode: '0644'
      notify: Daemon reload

    - name: Copy analytics debounce script
      copy:
        src: "{{ playbook_dir }}/../../scripts/analytics-debounce-check.sh"
        dest: /usr/local/bin/analytics-debounce-check.sh
        owner: root
        group: root
        mode: '0755'

    - name: Install polkit rule for analytics debounce
      copy:
        src: "{{ playbook_dir }}/../files/cocktaildb-analytics.rules"
        dest: /etc/polkit-1/rules.d/49-cocktaildb-analytics.rules
        owner: root
        group: root
        mode: '0644'
      notify: Restart polkit

    # Deploy Caddy configuration
    - name: Copy Caddyfile
      copy:
        src: "{{ playbook_dir }}/../../caddy/Caddyfile"
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'

    # Configure Caddy environment variables (domain, ACME email)
    - name: Create Caddy systemd override directory
      file:
        path: /etc/systemd/system/caddy.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Configure Caddy environment variables
      copy:
        dest: /etc/systemd/system/caddy.service.d/override.conf
        content: |
          [Service]
          Environment=DOMAIN_NAME={{ domain_name }}
          Environment=ACME_EMAIL=admin@{{ domain_name }}
        owner: root
        group: root
        mode: '0644'
      notify:
        - Daemon reload

    # Create environment file from template
    - name: Create environment file
      template:
        src: ../files/env.j2
        dest: "{{ app_home }}/.env"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0600'

    - name: Create analytics directory
      file:
        path: /var/lib/cocktaildb/analytics
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0755'

    # Ensure correct ownership
    - name: Set ownership of app directory
      file:
        path: "{{ app_home }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: yes

    - name: Stage migrations
      ansible.builtin.synchronize:
        src: "{{ playbook_dir }}/../../../migrations/"
        dest: "{{ release_root }}/migrations/"
        delete: yes

    - name: Set ownership of staged release
      ansible.builtin.file:
        path: "{{ release_root }}"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        recurse: yes

    - name: Apply safe infrastructure handlers before cutover
      ansible.builtin.meta: flush_handlers

    - name: Validate staged Caddy configuration
      ansible.builtin.command:
        argv:
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      environment:
        DOMAIN_NAME: "{{ domain_name }}"
        ACME_EMAIL: "admin@{{ domain_name }}"
      changed_when: false

    # Caddy has its admin API disabled. Restart only after validation and while
    # the old frontend/API are still active at their stable paths.
    - name: Restart Caddy
      ansible.builtin.systemd:
        name: caddy
        state: restarted

    - name: Run ordered deployment cutover
      ansible.builtin.command:
        argv:
          - "{{ app_home }}/scripts/deploy-cutover.sh"
      environment:
        APP_HOME: "{{ app_home }}"
        RELEASE_ID: "{{ deployment_release_id }}"
        RELEASE_ROOT: "{{ release_root }}"
        SERVED_WEB: "{{ app_home }}/web"
        APP_ENV: "{{ app_env }}"
      register: deployment_cutover
      changed_when: true

    # Enable systemd timers
    - name: Enable backup timer
      systemd:
        name: cocktaildb-backup.timer
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Enable analytics timer
      systemd:
        name: cocktaildb-analytics.timer
        enabled: no
        state: stopped

    - name: Enable analytics debounce timer
      systemd:
        name: cocktaildb-analytics-debounce.timer
        enabled: yes
        state: started

    - name: Release deployment lifecycle lock
      ansible.builtin.file:
        path: /var/lock/cocktaildb-deploy-ansible.lock
        state: absent

  handlers:
    - name: Daemon reload
      systemd:
        daemon_reload: yes

    - name: Restart polkit
      systemd:
        name: polkit
        state: restarted
